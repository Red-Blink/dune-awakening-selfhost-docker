# Optional Docker Socket Proxy overlay for defense-in-depth (S-05).
# Usage:
#   DUNE_DOCKER_SOCKET_PROXY_URL=tcp://127.0.0.1:2375 \
#     docker compose -f docker-compose.web.yml -f docker-compose.socket-proxy.yml up -d
services:
  dune-docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: dune-docker-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
    cap_drop:
      - ALL
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      POST: 1
      EXEC: 1
      BUILD: 1
      COMMIT: 0
      CONFIGS: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
      NODES: 0
      PLUGINS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
