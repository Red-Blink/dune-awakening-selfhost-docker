# Accepted findings for the full-tree and changed-file `trivy fs --scanners secret,misconfig` scan in
# tests/security-pr-checks.sh.
#
# Policy: every entry is scoped to specific PATHS, carries a written reason, and EXPIRES so it is re-triaged instead
# of living forever. Do NOT add a rule ID without `paths:`: a global ignore would silence the check for every
# future Dockerfile. When an entry expires the scan fails loudly on purpose; re-triage, then fix the finding or
# renew the date with a fresh justification.
#
# Triaged 2026-10-07, the first time this scan ran over the whole tree (until then the scanner binaries were not
# installed in CI, so it never ran at all). Result over the tracked files: gitleaks 0 findings; trivy 4 findings.
misconfigurations:
  - id: DS-0002
    paths:
      - "orchestrator/Dockerfile"
    statement: >-
      The orchestrator image sets no USER (it prepares a `dune` user but never switches to it) and needs the host's
      Docker socket mounted by docker-compose.yml, which is the architectural trust boundary of that design.
      Not a regression; moving it to a non-root user is a separate, larger change.
    expired_at: 2027-01-07
  - id: DS-0002
    paths:
      - "patches/experimental-tanks/2134304/Dockerfile"
      - "patches/experimental-tanks/2141883/Dockerfile"
      - "patches/experimental-tanks/2147284/Dockerfile"
      - "patches/experimental-tanks/2156652/Dockerfile"
      - "patches/experimental-tanks/2160922/Dockerfile"
      - "patches/experimental-tanks/2162777/Dockerfile"
      - "patches/experimental-tanks/2168446/Dockerfile"
    statement: >-
      Thin overlay images (`FROM ${BASE_IMAGE}` plus COPY --chown=dune:nogroup and one chmod) built on top of the
      vendor game-server base image. They set no USER of their own, so the runtime user is whatever that base
      image defines, which this repository cannot change. Re-check if the base image gains or drops a USER.
      Build 2147284 was re-triaged on 2026-10-09: vendor startup performs chown and SSH setup as root,
      then launches the game with su dune. Setting USER dune would break that startup contract.
      Build 2156652 was re-triaged on 2026-10-19 and retains the same root setup followed by su dune.
      Build 2160922 was re-triaged on 2026-10-20: run.sh still performs root ownership/SSH setup and su dune launch.
      Build 2162777 was re-triaged on 2026-10-22 and retains the same root setup followed by su dune.
      Build 2168446 was re-triaged on 2026-10-28: vendor startup still performs root ownership/SSH setup and su dune launch.
    expired_at: 2027-01-07
  - id: DS-0029
    paths:
      - "orchestrator/Dockerfile"
    statement: >-
      `apt-get install` without `--no-install-recommends` in the orchestrator image. Accepted here rather than
      changed in a CI PR because adding the flag changes the image's installed package set and needs its own
      build-and-run check. Re-triage and fix at expiry.
    expired_at: 2027-01-07
  - id: DS-0002
    paths:
      - "runtime/realtime-agent/Dockerfile"
    statement: >-
      The Realtime Data position agent (mvagent) has to run as root: it reads /proc/<pid>/mem of the game server
      processes, which needs ptrace rights over processes owned by other users. The final image is distroless with
      no shell, runs with every capability dropped except SYS_PTRACE and DAC_OVERRIDE, a read-only root file system
      and no-new-privileges, and listens on 127.0.0.1 only (docker-compose.realtime-agent.yml). It is installed only
      by the owner after an explicit confirmation. Triaged 2026-11-01. Re-check if the agent gains a non-root mode.
    expired_at: 2027-01-07
