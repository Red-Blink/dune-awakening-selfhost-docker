# Gitleaks configuration for dune-awakening-selfhost-docker
# The built-in fallback token is intentionally hardcoded
# to match the game server's expected default.
# See: console/api/src/rmq.js BUILTIN_COMMAND_AUTH_TOKEN

# Keep Gitleaks' maintained detection rules when this repository config is
# selected explicitly (for example, by tests/security-pr-checks.sh).
[extend]
  useDefault = true

# [allowlist] (singular) is deprecated as of gitleaks v8.25.0+ and cannot
# coexist with [[allowlists]] in the same config (confirmed directly:
# gitleaks refuses to load a config with both, "[allowlist] is deprecated,
# it cannot be used alongside [[allowlists]]") -- migrated to [[allowlists]].
[[allowlists]]
  description = "Known command-auth fallback shared by game server"
  regexes = [
    "Nu6VmPWUMvdPMeB7qErr",
  ]

# Real finding, upstream PR #202 maintainer review: gitleaks' discord-client-id
# rule matches the synthetic Discord snowflake ("123456789012345678" -- an
# obviously-fake, sequential-digit placeholder, not a real credential) used
# across several test fixtures (console/api/test/envFile.test.js,
# console/api/test/discordOAuthDisable.integration.test.js,
# console/web/src/features/auth/DiscordSetupWizard.test.tsx). Confirmed via
# `gitleaks detect --source . --no-git`, then confirming these test files
# use it purely as fixture data, never a real client ID.
[[allowlists]]
  description = "Synthetic Discord client ID used as test fixture data"
  regexes = [
    "123456789012345678",
  ]

# Pre-existing documentation example, not a real credential -- the literal
# string "local-dev-bot-api" in a curl example showing the Authorization
# header's shape for a local dev deployment.
[[allowlists]]
  description = "Documentation example bearer token, not a real credential"
  regexes = [
    "local-dev-bot-api",
  ]

# NOTE: tests/db-system-backup-test.sh's synthetic secret fixtures
# (admin-pw-8f2a-real, etc.) do NOT need an allowlist entry here --
# confirmed directly: `gitleaks detect --source
# tests/db-system-backup-test.sh` with the built-in default rules (and no
# fixture-specific allowlist at all) already produces zero findings, since
# these fixtures' variable names (SECRET_ADMIN_PASSWORD=, TEST_PASSPHRASE=)
# don't match any built-in rule's keyword+pattern requirements. A broad,
# permanent, repo-wide allowlist entry for these exact literal strings was
# added defensively in an earlier revision without verifying this -- an
# unverified assumption, not a fact, per this account's own review
# discipline. Removed rather than kept "just in case."
